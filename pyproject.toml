[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rich-matplotlib"
version = "0.1.0"
description = "Display matplotlib figures directly in the terminal using rich and sixel graphics."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Jonah Femiani", email = "jonah.femiani07@gmail.com" }]
keywords = ["matplotlib", "rich", "sixel", "terminal", "plotting"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Visualization",
]

dependencies = [
    "matplotlib>=3.0.0",
    "pillow>=9.0.0",
    "rich>=13.0.0",
    "textual-image>=0.1.0",
]

[project.optional-dependencies]
dev = [
    # numpy arrives anyway as a matplotlib dependency, but the demos import it
    # directly, so it is named here rather than relied on by accident.
    "numpy>=1.22",
    "pre-commit>=3.5.0",
    "pytest>=8.0.0",
    # Pinned to a minor series: ruff's formatter and lint rules change between
    # releases, and CI disagreeing with your local run is a miserable afternoon.
    "ruff>=0.16.0,<0.17",
]

[project.urls]
Homepage = "https://github.com/jfemiani10/rich-matplotlib"
Issues = "https://github.com/jfemiani10/rich-matplotlib/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/rich_matplotlib"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
