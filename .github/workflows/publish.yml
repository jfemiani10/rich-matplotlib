name: Publish

# Publishing is tied to a GitHub Release rather than a tag push, so cutting a release
# is one deliberate action with notes attached, and re-running it is not a git operation.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build

      # Catches a README that PyPI will refuse to render *before* the upload, which
      # matters because a version number on PyPI can never be reused.
      - name: Check metadata
        run: python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest

    # Trusted publishing: PyPI verifies this workflow's OIDC identity, so there is no
    # API token to store or rotate. The environment name must match the one registered
    # in the PyPI publisher settings.
    environment:
      name: pypi
      url: https://pypi.org/p/rich-matplotlib
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
