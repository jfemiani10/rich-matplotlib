# Local git hooks, managed by the `pre-commit` tool.
#
# Install them once per clone (they live in .git/hooks, which is not committed):
#
#     pre-commit install --hook-type pre-commit --hook-type pre-push
#
# Fast checks run at commit time; the test suite runs at push time, so committing
# stays instant and nothing broken reaches the remote.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
      # Catches a forgotten breakpoint() or pdb.set_trace().
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep this in step with the ruff pin in pyproject.toml, or CI and the hook
    # can disagree about the same file.
    rev: v0.16.2
    hooks:
      # `ruff format .` also formats python code blocks inside markdown, but these
      # hooks only look at python files by default -- so without `markdown` here the
      # hook passes locally and CI then fails on the README. They must agree.
      - id: ruff-check
        args: [--fix]
        types_or: [python, pyi, jupyter, markdown]
      - id: ruff-format
        types_or: [python, pyi, jupyter, markdown]

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        # Not a bare `pytest`: GUI git clients spawn git without the venv on PATH,
        # so the executable has to be located rather than assumed. See the script.
        entry: scripts/run-tests.sh -q
        language: script
        # The suite covers the whole project, so run it once rather than once
        # per changed file, and run it even when no Python file changed.
        pass_filenames: false
        always_run: true
        stages: [pre-push]
